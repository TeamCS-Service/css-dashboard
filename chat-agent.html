<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat - Staff Panel</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-soft: #eef2ff;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-2: #475569;
            --text-3: #94a3b8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 14px;
            --radius-sm: 8px;
            --radius-full: 999px;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #162032;
            --border: #334155;
            --text: #f1f5f9;
            --text-2: #94a3b8;
            --text-3: #475569;
            --primary-soft: rgba(79,70,229,0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .app { display: flex; height: 100vh; }

        /* ===== COL 1: USER LIST ===== */
        .col-users {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .col-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .col-header-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(79,70,229,0.28);
        }

        .col-header-icon i { color: white; font-size: 13px; }

        .col-header h2 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            flex: 1;
        }

        .theme-btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-2);
            font-size: 12px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover { background: var(--primary-soft); color: var(--primary); }

        /* Staff profile strip - FIXED LAYOUT */
        .staff-strip {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .staff-profile-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .staff-av {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .staff-av i { color: white; font-size: 15px; }

        .staff-info {
            flex: 1;
            min-width: 0;
        }

        .staff-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .staff-role-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            font-weight: 600;
            color: var(--warning);
            margin-top: 2px;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-3);
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: auto;
        }
        .logout-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* Navigation buttons row */
        .nav-buttons {
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 4px;
        }

        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
        }

        .nav-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: var(--primary);
        }

        .nav-btn i {
            font-size: 12px;
        }

        /* Search */
        .search-wrap {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-wrap i {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 11px;
            pointer-events: none;
        }

        .search-wrap input:focus { border-color: var(--primary); background: var(--surface); }

        /* User list */
        .list-label {
            padding: 10px 14px 4px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .users-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 0 8px 8px; 
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 10px 10px;
            border-radius: 10px;
            cursor: pointer;
            gap: 10px;
            margin-bottom: 2px;
            transition: background 0.15s;
            position: relative;
        }

        .user-item:hover { background: var(--surface-2); }
        .user-item.active { background: var(--primary-soft); }
        .user-item.active .user-item-name { color: var(--primary); }

        .user-item-av {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 700;
            color: white;
        }

        .user-item-info { flex: 1; min-width: 0; }

        .user-item-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-item-sub {
            font-size: 10px;
            color: var(--text-3);
            margin-top: 1px;
        }

        .user-unread {
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ===== COL 2: TOPIC LIST ===== */
        .col-topics {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .topics-col-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .topics-col-header h3 {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .topics-col-header p {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 4px;
        }

        .topics-list-inner { flex: 1; overflow-y: auto; padding: 8px; }

        .topic-item {
            display: flex;
            align-items: center;
            padding: 11px 10px;
            border-radius: 10px;
            cursor: pointer;
            gap: 10px;
            margin-bottom: 2px;
            transition: background 0.15s;
        }

        .topic-item:hover { background: var(--surface-2); }
        .topic-item.active { background: var(--primary-soft); }
        .topic-item.active .topic-item-name { color: var(--primary); }

        .topic-icon-wrap {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .topic-icon-wrap i { color: white; font-size: 15px; }

        .topic-item-meta { flex: 1; min-width: 0; }

        .topic-item-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-item-preview {
            font-size: 11px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .topic-item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .topic-time { font-size: 10px; color: var(--text-3); }

        .topic-unread {
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== COL 3: CHAT ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }

        .chat-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--text-3);
            padding: 40px;
        }

        .placeholder-icon {
            width: 72px;
            height: 72px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .placeholder-icon i { font-size: 28px; color: var(--text-3); }
        .chat-placeholder h3 { font-size: 15px; font-weight: 700; color: var(--text-2); }
        .chat-placeholder p { font-size: 12px; text-align: center; max-width: 260px; line-height: 1.6; }

        /* Active chat */
        .chat-header {
            padding: 14px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .chat-header-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-header-icon i { color: white; font-size: 15px; }

        .chat-header-info { flex: 1; min-width: 0; }

        .chat-header-info h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .chat-header-info p {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 2px;
        }

        .chat-header-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-context-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-2);
        }

        .user-context-chip i { color: var(--primary); font-size: 10px; }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message {
            display: flex;
            gap: 8px;
            animation: msgIn 0.2s ease;
        }

        @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .message.outgoing { flex-direction: row-reverse; }

        .msg-av {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            align-self: flex-end;
            font-size: 11px;
        }

        .msg-av.user-av { background: linear-gradient(135deg, #4f46e5, #818cf8); color: white; }
        .msg-av.staff-av { background: linear-gradient(135deg, #f59e0b, #f97316); color: white; }

        .msg-body { max-width: 65%; display: flex; flex-direction: column; gap: 2px; }

        .msg-sender {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-3);
            padding: 0 4px;
        }

        .message.outgoing .msg-sender { text-align: right; }

        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
        }

        .message.incoming .bubble {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message.outgoing .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-3);
            padding: 0 4px;
        }

        .message.outgoing .msg-time { text-align: right; }

        /* Date divider */
        .date-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 2px;
            color: var(--text-3);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .date-divider::before, .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Input */
        .input-area {
            padding: 12px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-wrap { flex: 1; position: relative; }

        .input-wrap input {
            width: 100%;
            padding: 10px 16px;
            padding-right: 46px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 999px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
            background: var(--surface);
        }

        .input-wrap input::placeholder { color: var(--text-3); }

        .send-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s;
        }

        .send-btn:hover { background: #4338ca; transform: translateY(-50%) scale(1.06); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Empty states */
        .empty-info {
            padding: 30px 16px;
            text-align: center;
            color: var(--text-3);
            font-size: 12px;
        }

        .empty-info i { font-size: 28px; margin-bottom: 8px; opacity: 0.4; display: block; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Spinner */
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app">

    <!-- COL 1: Daftar User/Agent -->
    <div class="col-users">
        <div class="col-header">
            <div class="col-header-icon"><i class="fas fa-headset"></i></div>
            <h2>Support Chat</h2>
            <button class="theme-btn" id="themeBtn"><i class="fas fa-moon" id="themeIcon"></i></button>
        </div>

        <div class="staff-strip">
            <!-- Baris profil staff (avatar, nama, role, logout) -->
            <div class="staff-profile-row">
                <div class="staff-av"><i class="fas fa-user-tie"></i></div>
                <div class="staff-info">
                    <div class="staff-name" id="userName">Memuat...</div>
                    <div class="staff-role-badge">
                        <i class="fas fa-shield-alt"></i> 
                        <span id="userRole">Staff</span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Keluar">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
            
            <!-- Tombol navigasi -->
            <div class="nav-buttons">
                <button class="nav-btn" id="navDashboardBtn">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </button>
            </div>
        </div>

        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchUsers" placeholder="Cari pengguna...">
        </div>

        <div class="list-label">Pengguna</div>
        <div class="users-list" id="usersList">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- COL 2: Topik dari User yang dipilih -->
    <div class="col-topics" id="colTopics" style="display:none;">
        <div class="topics-col-header">
            <h3 id="selectedUserName"><i class="fas fa-user"></i> —</h3>
            <p id="selectedUserInfo">Pilih topik untuk membuka percakapan</p>
        </div>
        <div class="topics-list-inner" id="topicsListInner">
            <div class="empty-info"><i class="fas fa-tags"></i>Pilih pengguna untuk melihat topik</div>
        </div>
    </div>

    <!-- COL 3: Area Chat -->
    <div class="chat-area" id="chatArea">

        <!-- Placeholder -->
        <div class="chat-placeholder" id="chatPlaceholder">
            <div class="placeholder-icon"><i class="fas fa-comments"></i></div>
            <h3>Pilih Percakapan</h3>
            <p>Pilih pengguna dan topik di sebelah kiri untuk membuka percakapan.</p>
        </div>

        <!-- Active chat -->
        <div id="chatActive" style="display:none;flex-direction:column;flex:1;min-height:0;">
            <div class="chat-header">
                <div class="chat-header-icon" id="chatHeaderIcon">
                    <i class="fas fa-comment"></i>
                </div>
                <div class="chat-header-info">
                    <h3 id="chatTopicName">-</h3>
                    <p id="chatTopicDesc">-</p>
                </div>
                <div class="chat-header-meta">
                    <div class="user-context-chip" id="userContextChip">
                        <i class="fas fa-user"></i>
                        <span id="chatUserName">-</span>
                    </div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="input-area">
                <div class="input-wrap">
                    <input type="text" id="messageInput" placeholder="Ketik balasan..." autocomplete="off">
                    <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDUZka4FZyLi_cv6X_5D4zeRsfkpqOlBpY",
        authDomain: "dashboard-css.firebaseapp.com",
        projectId: "dashboard-css",
        storageBucket: "dashboard-css.appspot.com",
        messagingSenderId: "771131792881",
        appId: "1:771131792881:web:ad634424225bd7de847850"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ==================== STATE ====================
    let currentUser = null;
    let userRole = null;
    let currentAgentId = null;
    let currentAgentName = '';
    let currentTopicId = null;
    let currentTopicColor = '#4f46e5';
    let allUsers = [];
    let filteredUsers = [];
    let topicsList = [];
    let messagesUnsub = null;
    let topicsUnsub = null;

    // ==================== INIT ====================
    async function init() {
        applyTheme();
        await initAuth();
    }

    function applyTheme() {
        const t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('themeIcon').className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const nxt = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nxt);
        localStorage.setItem('theme', nxt);
        document.getElementById('themeIcon').className = nxt === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    });

    function navigateToDashboard() {
        const role = userRole || 'staff';
        
        let dashboardUrl = '';
        if (role === 'super_admin' || role === 'admin') {
            dashboardUrl = 'summary-dashboard.html';
        } else if (role === 'it') {
            dashboardUrl = 'it-support.html';
        } else if (role === 'staff' || role === 'Customer Service Support') {
            dashboardUrl = 'pending-reports.html';
        } else {
            dashboardUrl = 'summary-dashboard.html';
        }
        
        if (currentUser) {
            sessionStorage.setItem('user', JSON.stringify({
                uid: currentUser.uid,
                email: currentUser.email,
                role: userRole
            }));
        }
        
        window.location.href = dashboardUrl;
    }

    async function initAuth() {
        return new Promise(resolve => {
            auth.onAuthStateChanged(async user => {
                if (user) {
                    currentUser = user;
                    await loadUserRole();
                    if (!canAccess()) {
                        alert('Akses ditolak. Hanya Staff dan Super Admin.');
                        window.location.href = 'index.html';
                        return;
                    }
                    setupUI();
                    await loadUsers();
                    resolve();
                } else {
                    const sess = sessionStorage.getItem('user');
                    if (sess) {
                        const d = JSON.parse(sess);
                        currentUser = { uid: d.uid, email: d.email };
                        userRole = d.role || 'staff';
                        if (!canAccess()) { alert('Akses ditolak.'); window.location.href = 'index.html'; return; }
                        setupUI();
                        await loadUsers();
                        resolve();
                    } else {
                        window.location.href = 'index.html';
                    }
                }
            });
        });
    }

    async function loadUserRole() {
        try {
            const snap = await db.collection('users').doc(currentUser.uid).get();
            userRole = snap.exists ? (snap.data().role || 'staff') : 'staff';
        } catch (e) {
            userRole = 'staff';
        }
    }

    const canAccess = () => {
        const allowedRoles = ['staff', 'super_admin', 'admin', 'it', 'Customer Service Support'];
        return allowedRoles.includes(userRole);
    };

    function setupUI() {
        const name = currentUser.displayName || currentUser.email?.split('@')[0] || 'Staff';
        document.getElementById('userName').textContent = name;
        
        let roleDisplay = '';
        if (userRole === 'super_admin') roleDisplay = 'Super Admin';
        else if (userRole === 'admin') roleDisplay = 'Admin';
        else if (userRole === 'it') roleDisplay = 'IT Support';
        else if (userRole === 'Customer Service Support') roleDisplay = 'Customer Service Support';
        else roleDisplay = 'Staff';
        document.getElementById('userRole').textContent = roleDisplay;

        const navBtn = document.getElementById('navDashboardBtn');
        if (navBtn) {
            navBtn.addEventListener('click', navigateToDashboard);
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
            sessionStorage.clear();
            window.location.href = 'index.html';
        });
    }

    async function loadUsers() {
        const container = document.getElementById('usersList');
        container.innerHTML = '<div class="spinner"></div>';

        try {
            const topicsSnap = await db.collectionGroup('topics').get();

            const uidSet = new Set();
            topicsSnap.forEach(doc => {
                const pathParts = doc.ref.path.split('/');
                if (pathParts[0] === 'chat_users' && pathParts.length === 4) {
                    uidSet.add(pathParts[1]);
                }
            });

            if (uidSet.size === 0) {
                container.innerHTML = '<div class="empty-info"><i class="fas fa-user-slash"></i>Belum ada pengguna yang login.<br>Minta pengguna login ke user-dashboard terlebih dahulu.</div>';
                return;
            }

            allUsers = [];

            for (const uid of uidSet) {
                let name = 'Pengguna';
                let email = '';
                try {
                    const uDoc = await db.collection('users').doc(uid).get();
                    if (uDoc.exists) {
                        const d = uDoc.data();
                        name = d.name || d.email?.split('@')[0] || 'Pengguna';
                        email = d.email || '';
                    }
                } catch (e) { console.warn('get user:', uid, e); }

                let totalUnread = 0;
                try {
                    const tSnap = await db.collection('chat_users').doc(uid).collection('topics').get();
                    tSnap.forEach(tDoc => {
                        totalUnread += tDoc.data().unreadCount?.[currentUser.uid] || 0;
                    });
                } catch (e) {}

                allUsers.push({ uid, name, email, totalUnread });
            }

            allUsers.sort((a, b) => {
                if (b.totalUnread !== a.totalUnread) return b.totalUnread - a.totalUnread;
                return a.name.localeCompare(b.name);
            });

            filteredUsers = [...allUsers];
            renderUsers();

            if (allUsers.length > 0) selectUser(allUsers[0].uid);

            setupRealtimeUnreadListener();

        } catch (e) {
            console.error('loadUsers error:', e);
            await loadUsersFallback();
        }
    }

    async function loadUsersFallback() {
        const container = document.getElementById('usersList');
        try {
            const snap = await db.collection('users').where('role', '==', 'user').get();
            allUsers = [];

            for (const doc of snap.docs) {
                const uid = doc.id;
                const d = doc.data();
                const name = d.name || d.email?.split('@')[0] || 'Pengguna';

                let totalUnread = 0;
                try {
                    const tSnap = await db.collection('chat_users').doc(uid).collection('topics').get();
                    tSnap.forEach(tDoc => {
                        totalUnread += tDoc.data().unreadCount?.[currentUser.uid] || 0;
                    });
                } catch (e) {}

                allUsers.push({ uid, name, email: d.email || '', totalUnread });
            }

            if (allUsers.length === 0) {
                container.innerHTML = '<div class="empty-info"><i class="fas fa-user-slash"></i>Belum ada pengguna yang terdaftar.</div>';
                return;
            }

            allUsers.sort((a, b) => {
                if (b.totalUnread !== a.totalUnread) return b.totalUnread - a.totalUnread;
                return a.name.localeCompare(b.name);
            });

            filteredUsers = [...allUsers];
            renderUsers();
            if (allUsers.length > 0) selectUser(allUsers[0].uid);
            setupRealtimeUnreadListener();

        } catch (e) {
            console.error('loadUsersFallback error:', e);
            container.innerHTML = '<div class="empty-info"><i class="fas fa-exclamation-triangle"></i>Gagal memuat pengguna. Periksa koneksi dan Firestore rules.</div>';
        }
    }

    function setupRealtimeUnreadListener() {
        allUsers.forEach(u => {
            db.collection('chat_users').doc(u.uid).collection('topics')
                .onSnapshot(snap => {
                    let total = 0;
                    snap.forEach(tDoc => {
                        total += tDoc.data().unreadCount?.[currentUser.uid] || 0;
                    });
                    const idx = allUsers.findIndex(x => x.uid === u.uid);
                    if (idx !== -1) {
                        allUsers[idx].totalUnread = total;
                        filteredUsers = allUsers.filter(x =>
                            x.name.toLowerCase().includes(
                                document.getElementById('searchUsers').value.toLowerCase()
                            )
                        );
                        renderUsers();
                    }
                }, () => {});
        });
    }

    function renderUsers() {
        const container = document.getElementById('usersList');
        if (filteredUsers.length === 0) {
            container.innerHTML = '<div class="empty-info"><i class="fas fa-user-slash"></i>Tidak ada pengguna ditemukan.</div>';
            return;
        }
        container.innerHTML = filteredUsers.map(u => {
            const initials = u.name.charAt(0).toUpperCase();
            const subtitle = u.email || 'Pengguna';
            return `
            <div class="user-item ${currentAgentId === u.uid ? 'active' : ''}" data-uid="${u.uid}">
                <div class="user-item-av">${initials}</div>
                <div class="user-item-info">
                    <div class="user-item-name">${escapeHtml(u.name)}</div>
                    <div class="user-item-sub">${escapeHtml(subtitle)}</div>
                </div>
                ${u.totalUnread > 0 ? `<div class="user-unread">${u.totalUnread}</div>` : ''}
            </div>`;
        }).join('');

        document.querySelectorAll('.user-item').forEach(el => {
            el.addEventListener('click', () => selectUser(el.dataset.uid));
        });
    }

    document.getElementById('searchUsers').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        filteredUsers = allUsers.filter(u => u.name.toLowerCase().includes(q));
        renderUsers();
    });

    async function selectUser(uid) {
        currentAgentId = uid;
        currentTopicId = null;
        const user = allUsers.find(u => u.uid === uid);
        currentAgentName = user?.name || 'Pengguna';

        document.querySelectorAll('.user-item').forEach(el =>
            el.classList.toggle('active', el.dataset.uid === uid));

        document.getElementById('selectedUserName').innerHTML =
            `<i class="fas fa-user"></i> ${escapeHtml(currentAgentName)}`;
        document.getElementById('selectedUserInfo').textContent = 'Pilih topik untuk membuka percakapan';
        document.getElementById('colTopics').style.display = 'flex';

        document.getElementById('chatPlaceholder').style.display = 'flex';
        document.getElementById('chatActive').style.display = 'none';

        if (topicsUnsub) topicsUnsub();
        loadTopicsForUser(uid);
    }

    function loadTopicsForUser(uid) {
        const ref = db.collection('chat_users').doc(uid).collection('topics');
        topicsUnsub = ref.onSnapshot(snap => {
            topicsList = [];
            snap.forEach(doc => {
                const d = doc.data();
                topicsList.push({
                    id: doc.id,
                    name: d.topicName,
                    icon: d.topicIcon,
                    desc: d.topicDescription,
                    color: d.topicColor,
                    lastMessage: d.lastMessage || '',
                    lastMessageTime: d.lastMessageTime,
                    lastMessageSender: d.lastMessageSender || '',
                    unread: d.unreadCount?.[currentUser.uid] || 0
                });
            });

            topicsList.sort((a, b) => {
                if (!a.lastMessageTime) return 1;
                if (!b.lastMessageTime) return -1;
                return b.lastMessageTime.toDate() - a.lastMessageTime.toDate();
            });

            renderTopics();
        });
    }

    function renderTopics() {
        const container = document.getElementById('topicsListInner');
        if (topicsList.length === 0) {
            container.innerHTML = '<div class="empty-info"><i class="fas fa-tags"></i>Pengguna ini belum memiliki topik. Tunggu sampai mereka login.</div>';
            return;
        }
        container.innerHTML = topicsList.map(t => {
            const timeLabel = t.lastMessageTime ? formatTime(t.lastMessageTime) : '';
            const isFromUser = t.lastMessageSender === 'user';
            const preview = t.lastMessage
                ? `${isFromUser ? '' : '<b style="color:var(--warning)">Staff: </b>'}${escapeHtml(t.lastMessage.substring(0, 32))}${t.lastMessage.length > 32 ? '…' : ''}`
                : '<span style="font-style:italic;color:var(--text-3)">Belum ada pesan</span>';

            return `
            <div class="topic-item ${currentTopicId === t.id ? 'active' : ''}" data-tid="${t.id}">
                <div class="topic-icon-wrap" style="background:linear-gradient(135deg,${t.color},${t.color}bb)">
                    <i class="fas ${t.icon}"></i>
                </div>
                <div class="topic-item-meta">
                    <div class="topic-item-name">${escapeHtml(t.name)}</div>
                    <div class="topic-item-preview">${preview}</div>
                </div>
                <div class="topic-item-right">
                    ${timeLabel ? `<span class="topic-time">${timeLabel}</span>` : ''}
                    ${t.unread > 0 ? `<span class="topic-unread">${t.unread}</span>` : ''}
                </div>
            </div>`;
        }).join('');

        document.querySelectorAll('.topic-item').forEach(el => {
            el.addEventListener('click', () => selectTopic(el.dataset.tid));
        });
    }

    async function selectTopic(topicId) {
        currentTopicId = topicId;
        const topic = topicsList.find(t => t.id === topicId);
        if (!topic) return;
        currentTopicColor = topic.color;

        document.querySelectorAll('.topic-item').forEach(el =>
            el.classList.toggle('active', el.dataset.tid === topicId));

        document.getElementById('chatTopicName').textContent = topic.name;
        document.getElementById('chatTopicDesc').textContent = topic.desc;
        document.getElementById('chatUserName').textContent = currentAgentName;
        const hi = document.getElementById('chatHeaderIcon');
        hi.style.background = `linear-gradient(135deg, ${topic.color}, ${topic.color}bb)`;
        hi.innerHTML = `<i class="fas ${topic.icon}"></i>`;

        document.getElementById('chatPlaceholder').style.display = 'none';
        const ca = document.getElementById('chatActive');
        ca.style.display = 'flex';

        try {
            await db.collection('chat_users').doc(currentAgentId)
                .collection('topics').doc(topicId)
                .update({ [`unreadCount.${currentUser.uid}`]: 0 });

            const ti = topicsList.findIndex(t => t.id === topicId);
            if (ti !== -1) {
                topicsList[ti].unread = 0;
                renderTopics();
                const ui = allUsers.findIndex(u => u.uid === currentAgentId);
                if (ui !== -1) {
                    allUsers[ui].totalUnread = topicsList.reduce((s, t) => s + t.unread, 0);
                    filteredUsers = [...allUsers];
                    renderUsers();
                }
            }
        } catch (e) { console.warn('markRead:', e); }

        await loadMessages(topicId);
    }

    async function loadMessages(topicId) {
        if (messagesUnsub) messagesUnsub();
        const ref = db.collection('chat_users').doc(currentAgentId)
            .collection('topics').doc(topicId).collection('messages');
        messagesUnsub = ref.orderBy('timestamp', 'asc').onSnapshot(snap => {
            renderMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
    }

    function renderMessages(messages) {
        const container = document.getElementById('messagesContainer');
        if (messages.length === 0) {
            container.innerHTML = `
                <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);padding:40px;">
                    <i class="fas fa-comment-dots" style="font-size:32px;opacity:0.35"></i>
                    <p style="font-size:12px">Belum ada pesan. Balas percakapan ini!</p>
                </div>`;
            return;
        }

        let lastDate = null;
        const html = messages.map(msg => {
            const isFromUser = msg.sender === 'user';
            const cls = isFromUser ? 'incoming' : 'outgoing';
            const avCls = isFromUser ? 'user-av' : 'staff-av';
            const avIcon = isFromUser ? 'fa-user' : 'fa-user-tie';

            let senderLabel;
            if (isFromUser) {
                senderLabel = escapeHtml(currentAgentName);
            } else {
                const role = msg.sender === 'super_admin' ? 'Admin' : msg.sender === 'it' ? 'IT' : 'Staff';
                senderLabel = `${role}: ${escapeHtml(msg.senderName || 'Support')}`;
            }

            let dateBlock = '';
            if (msg.timestamp) {
                const d = msg.timestamp.toDate();
                const dateStr = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
                if (dateStr !== lastDate) {
                    dateBlock = `<div class="date-divider">${dateStr}</div>`;
                    lastDate = dateStr;
                }
            }

            return `
                ${dateBlock}
                <div class="message ${cls}">
                    <div class="msg-av ${avCls}"><i class="fas ${avIcon}"></i></div>
                    <div class="msg-body">
                        <div class="msg-sender">${senderLabel}</div>
                        <div class="bubble">${escapeHtml(msg.text)}</div>
                        <div class="msg-time">${formatTimeFull(msg.timestamp)}</div>
                    </div>
                </div>`;
        }).join('');

        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentTopicId || !currentAgentId || !currentUser) return;

        input.value = '';
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        try {
            const topicRef = db.collection('chat_users').doc(currentAgentId)
                .collection('topics').doc(currentTopicId);

            const staffName = document.getElementById('userName').textContent;
            const senderType = userRole === 'super_admin' ? 'super_admin' : userRole === 'it' ? 'it' : 'staff';

            await topicRef.collection('messages').add({
                text,
                sender: senderType,
                senderId: currentUser.uid,
                senderName: staffName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                read: false
            });

            await topicRef.update({
                lastMessage: text,
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                lastMessageSender: senderType,
                lastMessageSenderId: currentUser.uid,
                lastMessageSenderName: staffName,
                unreadUser: firebase.firestore.FieldValue.increment(1)
            });

        } catch (err) {
            console.error('send error:', err);
            alert('Gagal mengirim: ' + err.message);
            input.value = text;
        } finally {
            btn.disabled = false;
            input.focus();
        }
    }

    function formatTime(ts) {
        if (!ts) return '';
        const d = ts.toDate();
        const now = new Date();
        const diff = now - d;
        const m = Math.floor(diff / 60000);
        const h = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);
        if (m < 1) return 'baru';
        if (m < 60) return `${m}m`;
        if (h < 24) return `${h}j`;
        if (days < 7) return `${days}h`;
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    function formatTimeFull(ts) {
        if (!ts) return '';
        return ts.toDate().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', init);
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
</script>
</body>
</html>
