<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Support Staff - Smart Chat Panel</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-soft: rgba(99, 102, 241, 0.12);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --surface-3: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-2: #475569;
            --text-3: #94a3b8;
            
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 24px rgba(0,0,0,0.12);
            --radius: 14px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            
            --sidebar-w: 300px;
            --topics-w: 280px;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #162032;
            --surface-3: #1a2332;
            --border: #334155;
            --text: #f1f5f9;
            --text-2: #cbd5e1;
            --text-3: #64748b;
            --primary-soft: rgba(99, 102, 241, 0.2);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            font-weight: 500;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* ========== SIDEBAR USER ========== */
        .col-users {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .col-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .col-header-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .col-header-icon i { color: white; font-size: 14px; }

        .col-header h2 {
            font-size: 16px;
            font-weight: 700;
            flex: 1;
            color: var(--text);
        }

        .theme-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-2);
            transition: all 0.2s;
        }
        .theme-btn:hover { background: var(--primary-soft); color: var(--primary); }

        .staff-strip {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
        }

        .staff-profile-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .staff-av {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .staff-av i { color: white; font-size: 16px; }

        .staff-info { flex: 1; }
        .staff-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .staff-role-badge {
            font-size: 11px;
            color: var(--warning);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 7px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .logout-btn:hover { background: var(--danger); color: white; }

        .nav-buttons {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .nav-btn {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-2);
            transition: all 0.2s;
        }
        .nav-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-light); }

        .search-wrap {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .search-wrap i {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 12px;
        }
        .search-wrap input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text);
            outline: none;
        }
        .search-wrap input:focus { border-color: var(--primary); background: var(--surface); }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .user-item:hover { background: var(--surface-3); }
        .user-item.active { background: var(--primary-soft); }
        .user-item.active .user-item-name { color: var(--primary); font-weight: 700; }

        .user-item-av {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }
        .user-item-info { flex: 1; min-width: 0; }
        .user-item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-unread {
            background: var(--danger);
            color: white;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        /* ========== COL 2: TOPICS ========== */
        .col-topics {
            width: var(--topics-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .topics-col-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .topics-col-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topics-col-header p {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 4px;
        }
        .topics-list-inner {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .topic-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .topic-item:hover { background: var(--surface-3); }
        .topic-item.active { background: var(--primary-soft); }
        .topic-item.active .topic-item-name { color: var(--primary); font-weight: 700; }

        .topic-icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .topic-icon-wrap i { color: white; font-size: 16px; }
        .topic-item-meta { flex: 1; min-width: 0; }
        .topic-item-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topic-preview {
            font-size: 11px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* ========== CHAT AREA ========== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* HEADER PANJANG */
        .chat-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            z-index: 2;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .chat-header-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .chat-header-icon i { color: white; font-size: 18px; }
        .chat-header-text h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }
        .chat-header-text p {
            font-size: 12px;
            color: var(--text-3);
            margin-top: 2px;
        }

        /* SEARCH GLOBAL */
        .search-container {
            position: relative;
            width: 280px;
        }
        .search-wrapper {
            position: relative;
        }
        .search-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 13px;
        }
        #globalSearchInput {
            width: 100%;
            padding: 9px 36px 9px 36px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 9999px;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
        }
        #globalSearchInput:focus {
            border-color: var(--primary);
            background: var(--surface);
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-3);
            display: none;
        }
        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            max-height: 320px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }
        .search-suggestions.show { display: block; }
        .suggestion-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: var(--primary-soft); }
        .suggestion-topic {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .suggestion-text {
            font-size: 13px;
            color: var(--text);
        }
        .suggestion-highlight {
            background: rgba(245, 158, 11, 0.3);
            border-radius: 3px;
            font-weight: 600;
        }

        /* MESSAGES */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .date-divider {
            text-align: center;
            margin: 16px 0 8px;
            position: relative;
        }
        .date-divider span {
            font-size: 11px;
            font-weight: 600;
            background: var(--surface-2);
            padding: 4px 14px;
            border-radius: 30px;
            color: var(--text-3);
            border: 1px solid var(--border);
        }
        .message {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .message.outgoing {
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .user-av {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }
        .staff-av {
            background: linear-gradient(135deg, #f59e0b, #f97316);
        }
        .msg-avatar i { color: white; font-size: 12px; }
        .msg-body {
            max-width: 65%;
            display: flex;
            flex-direction: column;
        }
        .message.outgoing .msg-body {
            align-items: flex-end;
        }
        .msg-sender {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-3);
            padding: 0 4px;
            margin-bottom: 3px;
        }
        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.incoming .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }
        .message.outgoing .bubble {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-time {
            font-size: 10px;
            color: var(--text-3);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: flex-end;
        }
        /* Status centang WA */
        .msg-status {
            margin-left: 4px;
            font-size: 11px;
        }
        .status-read {
            color: #34b7f1;
        }
        .status-sent {
            color: #b0b3b8;
        }

        /* INPUT */
        .input-area {
            padding: 12px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
        .input-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 30px;
            padding: 6px 6px 6px 18px;
            transition: all 0.2s;
        }
        .input-wrap:focus-within {
            border-color: var(--primary);
            background: var(--surface);
        }
        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 13px;
            padding: 8px 0;
            color: var(--text);
        }
        #messageInput::placeholder {
            color: var(--text-3);
        }
        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.5; }

        .empty-info, .spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-3);
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>
<div class="app">

    <!-- KOLOM 1: User -->
    <div class="col-users">
        <div class="col-header">
            <div class="col-header-icon"><i class="fas fa-headset"></i></div>
            <h2>Support Chat</h2>
            <button class="theme-btn" id="themeBtn"><i class="fas fa-moon" id="themeIcon"></i></button>
        </div>
        <div class="staff-strip">
            <div class="staff-profile-row">
                <div class="staff-av"><i class="fas fa-user-tie"></i></div>
                <div class="staff-info">
                    <div class="staff-name" id="userName">Memuat...</div>
                    <div class="staff-role-badge"><i class="fas fa-shield-alt"></i> <span id="userRole">Staff</span></div>
                </div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" id="navDashboardBtn"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
            </div>
        </div>
        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchUsers" placeholder="Cari pengguna...">
        </div>
        <div class="users-list" id="usersList"><div class="spinner"></div></div>
    </div>

    <!-- KOLOM 2: Topik -->
    <div class="col-topics" id="colTopics" style="display: none;">
        <div class="topics-col-header">
            <h3 id="selectedUserName"><i class="fas fa-user"></i> —</h3>
            <p id="selectedUserInfo">Pilih topik untuk membuka percakapan</p>
        </div>
        <div class="topics-list-inner" id="topicsListInner"></div>
    </div>

    <!-- KOLOM 3: Chat dengan Header Panjang + Search Global -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-header-icon" id="chatHeaderIcon" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <div class="chat-header-text">
                    <h3 id="chatTopicName">Support Chat</h3>
                    <p id="chatTopicDesc">Pilih pengguna & topik</p>
                </div>
            </div>
            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearchInput" placeholder="Cari di semua pesan...">
                    <span class="search-clear" id="searchClear"><i class="fas fa-times-circle"></i></span>
                </div>
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-info"><i class="fas fa-comments"></i> Pilih percakapan</div>
        </div>

        <div class="input-area">
            <div class="input-wrap">
                <input type="text" id="messageInput" placeholder="Ketik balasan..." autocomplete="off">
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDUZka4FZyLi_cv6X_5D4zeRsfkpqOlBpY",
        authDomain: "dashboard-css.firebaseapp.com",
        projectId: "dashboard-css",
        storageBucket: "dashboard-css.appspot.com",
        messagingSenderId: "771131792881",
        appId: "1:771131792881:web:ad634424225bd7de847850"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null, userRole = null;
    let currentAgentId = null, currentTopicId = null;
    let topicsList = [];
    let messagesUnsub = null;
    let allUsers = [];
    let allMessagesCache = [];
    let currentAgentName = '';

    // DOM
    const themeBtn = document.getElementById('themeBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const navDashboard = document.getElementById('navDashboardBtn');
    const usersListDiv = document.getElementById('usersList');
    const searchUsers = document.getElementById('searchUsers');
    const colTopics = document.getElementById('colTopics');
    const topicsContainer = document.getElementById('topicsListInner');
    const messagesContainer = document.getElementById('messagesContainer');
    const globalSearchInput = document.getElementById('globalSearchInput');
    const searchSuggestions = document.getElementById('searchSuggestions');
    const searchClear = document.getElementById('searchClear');
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');

    // ========== THEME ==========
    function applyTheme() {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme');
        const nxt = cur === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', nxt);
        applyTheme();
    }
    themeBtn.addEventListener('click', toggleTheme);
    applyTheme();

    // ========== AUTH ==========
    async function initAuth() {
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadUserRole();
                if (!canAccess()) { alert('Akses ditolak.'); window.location.href = 'index.html'; return; }
                setupUI();
                await loadAllUsers();
            } else {
                const sess = sessionStorage.getItem('user');
                if (sess) {
                    const d = JSON.parse(sess);
                    currentUser = { uid: d.uid, email: d.email };
                    userRole = d.role || 'staff';
                    setupUI();
                    await loadAllUsers();
                } else {
                    window.location.href = 'index.html';
                }
            }
        });
    }

    async function loadUserRole() {
        try {
            const snap = await db.collection('users').doc(currentUser.uid).get();
            userRole = snap.exists ? snap.data().role : 'staff';
        } catch(e) { userRole = 'staff'; }
    }

    function canAccess() {
        return ['staff', 'super_admin', 'admin', 'it', 'Customer Service Support'].includes(userRole);
    }

    function setupUI() {
        const name = currentUser.displayName || currentUser.email?.split('@')[0] || 'Staff';
        document.getElementById('userName').innerText = name;
        let roleDisplay = 'Staff';
        if (userRole === 'super_admin') roleDisplay = 'Super Admin';
        else if (userRole === 'admin') roleDisplay = 'Admin';
        else if (userRole === 'it') roleDisplay = 'IT Support';
        document.getElementById('userRole').innerText = roleDisplay;
        logoutBtn.onclick = () => { auth.signOut(); sessionStorage.clear(); window.location.href = 'index.html'; };
        navDashboard.onclick = () => window.location.href = 'summary-dashboard.html';
    }

    // ========== LOAD USERS & BUILD GLOBAL CACHE ==========
    async function loadAllUsers() {
        usersListDiv.innerHTML = '<div class="spinner"></div>';
        try {
            const topicsSnap = await db.collectionGroup('topics').get();
            const uidSet = new Set();
            topicsSnap.forEach(doc => {
                const parts = doc.ref.path.split('/');
                if (parts[0] === 'chat_users') uidSet.add(parts[1]);
            });
            if (uidSet.size === 0) {
                usersListDiv.innerHTML = '<div class="empty-info">Belum ada pengguna</div>';
                return;
            }
            allUsers = [];
            for (const uid of uidSet) {
                let name = 'Pengguna';
                try {
                    const uDoc = await db.collection('users').doc(uid).get();
                    if (uDoc.exists) name = uDoc.data().name || uDoc.data().email?.split('@')[0] || 'Pengguna';
                } catch(e) {}
                let totalUnread = 0;
                const tSnap = await db.collection('chat_users').doc(uid).collection('topics').get();
                tSnap.forEach(t => { totalUnread += t.data().unreadCount?.[currentUser.uid] || 0; });
                allUsers.push({ uid, name, totalUnread });
            }
            allUsers.sort((a,b) => b.totalUnread - a.totalUnread);
            renderUsers();
            if (allUsers.length) selectUser(allUsers[0].uid);
            await buildGlobalSearchCache();
        } catch(e) {
            console.error(e);
            usersListDiv.innerHTML = '<div class="empty-info">Gagal memuat pengguna</div>';
        }
    }

    function renderUsers() {
        const term = searchUsers.value.toLowerCase();
        const filtered = allUsers.filter(u => u.name.toLowerCase().includes(term));
        usersListDiv.innerHTML = filtered.map(u => `
            <div class="user-item ${currentAgentId === u.uid ? 'active' : ''}" data-uid="${u.uid}">
                <div class="user-item-av">${u.name.charAt(0).toUpperCase()}</div>
                <div class="user-item-info">
                    <div class="user-item-name">${escapeHtml(u.name)}</div>
                </div>
                ${u.totalUnread > 0 ? `<div class="user-unread">${u.totalUnread}</div>` : ''}
            </div>
        `).join('');
        document.querySelectorAll('.user-item').forEach(el => {
            el.addEventListener('click', () => selectUser(el.dataset.uid));
        });
    }
    searchUsers.addEventListener('input', () => renderUsers());

    // GLOBAL SEARCH CACHE
    async function buildGlobalSearchCache() {
        allMessagesCache = [];
        for (const user of allUsers) {
            const topicsSnap = await db.collection('chat_users').doc(user.uid).collection('topics').get();
            for (const topicDoc of topicsSnap.docs) {
                const topic = topicDoc.data();
                const msgsSnap = await db.collection('chat_users').doc(user.uid).collection('topics').doc(topicDoc.id).collection('messages').orderBy('timestamp', 'asc').get();
                msgsSnap.forEach(msgDoc => {
                    const msg = msgDoc.data();
                    allMessagesCache.push({
                        userId: user.uid,
                        userName: user.name,
                        topicId: topicDoc.id,
                        topicName: topic.topicName,
                        topicIcon: topic.topicIcon,
                        topicColor: topic.topicColor,
                        text: msg.text,
                        sender: msg.sender,
                        timestamp: msg.timestamp
                    });
                });
            }
        }
    }

    function getGlobalSuggestions(query) {
        if (!query.trim()) return [];
        const lower = query.toLowerCase();
        const results = [];
        for (const item of allMessagesCache) {
            if (item.text && item.text.toLowerCase().includes(lower)) {
                results.push(item);
                if (results.length >= 15) break;
            }
        }
        return results;
    }

    function highlightText(text, query) {
        if (!query) return escapeHtml(text);
        const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
        return escapeHtml(text).replace(regex, `<mark class="suggestion-highlight">$1</mark>`);
    }

    function renderGlobalSuggestions(suggestions, query) {
        if (!suggestions.length || !query) {
            searchSuggestions.classList.remove('show');
            return;
        }
        searchSuggestions.innerHTML = suggestions.map(sug => `
            <div class="suggestion-item" data-user-id="${sug.userId}" data-topic-id="${sug.topicId}" data-message-text="${escapeHtml(sug.text)}">
                <div class="suggestion-topic">
                    <i class="fas ${sug.topicIcon}" style="color:${sug.topicColor}"></i> ${escapeHtml(sug.userName)} / ${escapeHtml(sug.topicName)}
                </div>
                <div class="suggestion-text">${highlightText(sug.text, query)}</div>
            </div>
        `).join('');
        searchSuggestions.classList.add('show');
        document.querySelectorAll('.suggestion-item').forEach(el => {
            el.addEventListener('click', async () => {
                const userId = el.dataset.userId;
                const topicId = el.dataset.topicId;
                const msgText = el.dataset.messageText;
                if (userId && topicId) {
                    await selectUser(userId);
                    await selectTopic(topicId);
                    setTimeout(() => {
                        const bubbles = document.querySelectorAll('.bubble');
                        for (let b of bubbles) {
                            if (b.innerText.includes(msgText)) {
                                b.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                b.style.backgroundColor = 'rgba(245,158,11,0.3)';
                                setTimeout(() => b.style.backgroundColor = '', 2000);
                                break;
                            }
                        }
                    }, 600);
                }
                hideGlobalSuggestions();
                globalSearchInput.value = '';
            });
        });
    }

    function hideGlobalSuggestions() {
        searchSuggestions.classList.remove('show');
        searchSuggestions.innerHTML = '';
    }

    let searchDebounce;
    globalSearchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        searchClear.style.display = query ? 'block' : 'none';
        clearTimeout(searchDebounce);
        if (query) {
            searchDebounce = setTimeout(() => {
                const suggestions = getGlobalSuggestions(query);
                renderGlobalSuggestions(suggestions, query);
            }, 300);
        } else {
            hideGlobalSuggestions();
        }
    });
    searchClear.addEventListener('click', () => {
        globalSearchInput.value = '';
        hideGlobalSuggestions();
        searchClear.style.display = 'none';
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) hideGlobalSuggestions();
    });

    // ========== SELECT USER & TOPICS ==========
    async function selectUser(uid) {
        if (messagesUnsub) messagesUnsub();
        currentAgentId = uid;
        currentTopicId = null;
        const user = allUsers.find(u => u.uid === uid);
        currentAgentName = user?.name || 'Pengguna';
        document.getElementById('selectedUserName').innerHTML = `<i class="fas fa-user"></i> ${escapeHtml(currentAgentName)}`;
        document.getElementById('selectedUserInfo').innerText = 'Pilih topik';
        colTopics.style.display = 'flex';
        messagesContainer.innerHTML = '<div class="empty-info">Pilih topik</div>';
        // load topics
        const ref = db.collection('chat_users').doc(uid).collection('topics');
        const snap = await ref.get();
        topicsList = snap.docs.map(d => ({ id: d.id, ...d.data(), unread: d.data().unreadCount?.[currentUser.uid] || 0 }));
        topicsList.sort((a,b) => (b.lastMessageTime?.toDate()||0) - (a.lastMessageTime?.toDate()||0));
        renderTopics();
    }

    function renderTopics() {
        if (!topicsList.length) {
            topicsContainer.innerHTML = '<div class="empty-info">Belum ada topik</div>';
            return;
        }
        topicsContainer.innerHTML = topicsList.map(t => `
            <div class="topic-item ${currentTopicId === t.id ? 'active' : ''}" data-tid="${t.id}">
                <div class="topic-icon-wrap" style="background:linear-gradient(135deg,${t.topicColor},${t.topicColor}bb)">
                    <i class="fas ${t.topicIcon}"></i>
                </div>
                <div class="topic-item-meta">
                    <div class="topic-item-name">${escapeHtml(t.topicName)}</div>
                    <div class="topic-preview">${escapeHtml(t.lastMessage?.substring(0,30) || '')}</div>
                </div>
                ${t.unread ? `<div class="user-unread">${t.unread}</div>` : ''}
            </div>
        `).join('');
        document.querySelectorAll('.topic-item').forEach(el => {
            el.addEventListener('click', () => selectTopic(el.dataset.tid));
        });
    }

    async function selectTopic(topicId) {
        if (messagesUnsub) messagesUnsub();
        currentTopicId = topicId;
        const topic = topicsList.find(t => t.id === topicId);
        if (topic) {
            document.getElementById('chatTopicName').innerText = topic.topicName;
            document.getElementById('chatTopicDesc').innerText = topic.topicDescription;
            const iconDiv = document.getElementById('chatHeaderIcon');
            iconDiv.style.background = `linear-gradient(135deg, ${topic.topicColor}, ${topic.topicColor}bb)`;
            iconDiv.innerHTML = `<i class="fas ${topic.topicIcon}"></i>`;
        }
        // Mark unread for staff
        await db.collection('chat_users').doc(currentAgentId).collection('topics').doc(topicId).update({ [`unreadCount.${currentUser.uid}`]: 0 });
        // Load messages with realtime
        const msgRef = db.collection('chat_users').doc(currentAgentId).collection('topics').doc(topicId).collection('messages').orderBy('timestamp', 'asc');
        messagesUnsub = msgRef.onSnapshot(snap => {
            const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderMessagesWithStatus(msgs);
        });
    }

    // ========== RENDER PESAN + STATUS CENTANG ==========
    function renderMessagesWithStatus(messages) {
        if (!messages.length) {
            messagesContainer.innerHTML = '<div class="empty-info">Belum ada pesan. Kirim pesan pertama.</div>';
            return;
        }
        let lastDate = null;
        let html = '';
        messages.forEach(msg => {
            const isOutgoing = (msg.sender !== 'user'); // staff/super_admin/it
            const senderName = isOutgoing ? (msg.senderName || 'Staff') : (msg.senderName || currentAgentName);
            if (msg.timestamp) {
                const d = msg.timestamp.toDate();
                const dateStr = d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long' });
                if (dateStr !== lastDate) {
                    html += `<div class="date-divider"><span>${dateStr}</span></div>`;
                    lastDate = dateStr;
                }
            }
            let statusHtml = '';
            if (isOutgoing) {
                const isRead = msg.read === true;
                if (isRead) {
                    statusHtml = `<span class="msg-status status-read"><i class="fas fa-check-double"></i></span>`;
                } else {
                    statusHtml = `<span class="msg-status status-sent"><i class="fas fa-check"></i><i class="fas fa-check"></i></span>`;
                }
            }
            html += `
                <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                    <div class="msg-avatar ${isOutgoing ? 'staff-av' : 'user-av'}">
                        <i class="fas ${isOutgoing ? 'fa-user-tie' : 'fa-user'}"></i>
                    </div>
                    <div class="msg-body">
                        <div class="msg-sender">${escapeHtml(senderName)}</div>
                        <div class="bubble">${escapeHtml(msg.text)}</div>
                        <div class="msg-time">
                            ${msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'}) : ''}
                            ${statusHtml}
                        </div>
                    </div>
                </div>
            `;
        });
        messagesContainer.innerHTML = html;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ========== SEND PESAN ==========
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !currentTopicId || !currentAgentId) return;
        messageInput.value = '';
        sendBtn.disabled = true;
        try {
            const topicRef = db.collection('chat_users').doc(currentAgentId).collection('topics').doc(currentTopicId);
            const staffName = document.getElementById('userName').innerText;
            const senderType = userRole === 'super_admin' ? 'super_admin' : (userRole === 'it' ? 'it' : 'staff');
            await topicRef.collection('messages').add({
                text,
                sender: senderType,
                senderId: currentUser.uid,
                senderName: staffName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                read: false
            });
            await topicRef.update({
                lastMessage: text,
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                lastMessageSender: senderType,
                [`unreadCount.${currentUser.uid}`]: 0
            });
            // Update cache (optional)
            allMessagesCache.push({
                userId: currentAgentId,
                userName: currentAgentName,
                topicId: currentTopicId,
                topicName: topicsList.find(t=>t.id===currentTopicId)?.topicName,
                text: text,
                sender: senderType,
                timestamp: new Date()
            });
        } catch(e) { alert('Gagal kirim'); messageInput.value = text; }
        finally { sendBtn.disabled = false; messageInput.focus(); }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // Helper
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function escapeRegex(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    initAuth();
</script>
</body>
