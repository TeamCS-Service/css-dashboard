<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Support Chat</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-soft: #eef2ff;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #e2e8f0;
            --border-soft: #f1f5f9;
            --text: #0f172a;
            --text-2: #475569;
            --text-3: #94a3b8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
            --radius: 14px;
            --radius-sm: 8px;
            --radius-full: 999px;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #162032;
            --border: #334155;
            --border-soft: #1e293b;
            --text: #f1f5f9;
            --text-2: #94a3b8;
            --text-3: #475569;
            --primary-soft: rgba(79,70,229,0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .app { display: flex; height: 100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-top {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(79,70,229,0.3);
        }

        .brand-icon i { color: white; font-size: 15px; }

        .brand-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .theme-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-2);
            transition: all 0.2s;
        }
        .theme-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-light); }

        /* Profile card */
        .profile-card {
            margin: 12px;
            padding: 14px;
            background: var(--primary-soft);
            border-radius: var(--radius);
            border: 1px solid transparent;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar i { color: white; font-size: 17px; }

        .profile-info { flex: 1; min-width: 0; }

        .profile-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-role {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .logout-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* Topik list */
        .topics-header {
            padding: 16px 16px 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .topics-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }

        .topic-item {
            display: flex;
            align-items: center;
            padding: 12px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            gap: 12px;
            transition: all 0.18s;
            margin-bottom: 2px;
            position: relative;
        }

        .topic-item:hover { background: var(--surface-2); }

        .topic-item.active {
            background: var(--primary-soft);
        }

        .topic-item.active .topic-name { color: var(--primary); }

        .topic-icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .topic-icon-wrap i { color: white; font-size: 16px; }

        .topic-meta { flex: 1; min-width: 0; }

        .topic-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-preview {
            font-size: 11px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
            flex-shrink: 0;
        }

        .topic-time {
            font-size: 10px;
            color: var(--text-3);
        }

        .unread-badge {
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-3);
            padding: 40px;
        }

        .chat-empty-icon {
            width: 80px;
            height: 80px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-empty-icon i { font-size: 32px; color: var(--text-3); }
        .chat-empty h3 { font-size: 16px; font-weight: 700; color: var(--text-2); }
        .chat-empty p { font-size: 13px; text-align: center; max-width: 300px; line-height: 1.6; }

        /* Chat header */
        .chat-header {
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-sm);
        }

        .chat-header-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-header-icon i { color: white; font-size: 16px; }

        .chat-header-text h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .chat-header-text p {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 2px;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-group { display: flex; flex-direction: column; gap: 3px; }

        .message {
            display: flex;
            gap: 8px;
            animation: msgIn 0.2s ease;
        }

        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message.outgoing { flex-direction: row-reverse; }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
            align-self: flex-end;
        }

        .msg-avatar.user-av { background: linear-gradient(135deg, var(--primary), #818cf8); color: white; }
        .msg-avatar.staff-av { background: linear-gradient(135deg, #f59e0b, #f97316); color: white; }

        .msg-body { max-width: 65%; display: flex; flex-direction: column; gap: 2px; }

        .msg-sender {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-3);
            padding: 0 4px;
        }

        .message.outgoing .msg-sender { text-align: right; }

        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.incoming .bubble {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message.outgoing .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-3);
            padding: 0 4px;
        }

        .message.outgoing .msg-time { text-align: right; }

        /* Date divider */
        .date-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0 4px;
            color: var(--text-3);
            font-size: 11px;
            font-weight: 600;
        }

        .date-divider::before, .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Input area */
        .input-area {
            padding: 14px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrap {
            flex: 1;
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 16px;
            padding-right: 48px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-full);
            color: var(--text);
            font-size: 13.5px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        .input-wrap input::placeholder { color: var(--text-3); }

        .send-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.2s;
        }

        .send-btn:hover { background: #4338ca; transform: translateY(-50%) scale(1.06); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

        /* Spinner */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 640px) {
            .sidebar { width: 100%; display: none; }
            .sidebar.show { display: flex; position: fixed; top: 0; left: 0; height: 100vh; z-index: 50; width: 280px; box-shadow: var(--shadow-lg); }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-headset"></i></div>
                <span class="brand-name">Support Chat</span>
            </div>
            <button class="theme-btn" id="themeBtn" title="Toggle tema"><i class="fas fa-moon" id="themeIcon"></i></button>
        </div>

        <div class="profile-card">
            <div class="profile-row">
                <div class="avatar"><i class="fas fa-user"></i></div>
                <div class="profile-info">
                    <div class="profile-name" id="userName">Memuat...</div>
                    <div class="profile-role"><span class="online-dot"></span> <span id="userRole">Pengguna</span></div>
                </div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</button>
            </div>
        </div>

        <div class="topics-header">Kategori Bantuan</div>
        <div class="topics-list" id="topicsList">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <!-- Empty state default -->
        <div class="chat-empty" id="chatEmpty">
            <div class="chat-empty-icon"><i class="fas fa-comment-dots"></i></div>
            <h3>Mulai Percakapan</h3>
            <p>Pilih kategori di sebelah kiri untuk mengirim pesan kepada tim support kami.</p>
        </div>

        <!-- Active chat (hidden by default) -->
        <div id="chatActive" style="display:none; flex-direction:column; flex:1; min-height:0;">
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-icon" id="chatHeaderIcon">
                    <i class="fas fa-comment"></i>
                </div>
                <div class="chat-header-text">
                    <h3 id="chatTopicName">-</h3>
                    <p id="chatTopicDesc">-</p>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="input-area">
                <div class="input-wrap">
                    <input type="text" id="messageInput" placeholder="Tulis pesan..." autocomplete="off">
                    <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDUZka4FZyLi_cv6X_5D4zeRsfkpqOlBpY",
        authDomain: "dashboard-css.firebaseapp.com",
        projectId: "dashboard-css",
        storageBucket: "dashboard-css.appspot.com",
        messagingSenderId: "771131792881",
        appId: "1:771131792881:web:ad634424225bd7de847850"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ==================== TOPIK DEFAULT ====================
    const DEFAULT_TOPICS = [
        { id: 'report_panel',        name: 'Report Panel',         icon: 'fa-file-alt',      desc: 'Laporan dan panel monitoring',  color: '#4f46e5' },
        { id: 'top_up_credit',       name: 'Top Up Kredit',        icon: 'fa-coins',         desc: 'Top up kredit dan transaksi',   color: '#10b981' },
        { id: 'general_discuss',     name: 'General Discuss',      icon: 'fa-users',         desc: 'Diskusi umum layanan',          color: '#f59e0b' },
        { id: 'information',         name: 'Informasi',            icon: 'fa-info-circle',   desc: 'Pengumuman penting',            color: '#ec4899' },
        { id: 'report_phising',      name: 'Report Phising',       icon: 'fa-shield-alt',    desc: 'Laporan aktivitas mencurigakan', color: '#ef4444' },
        { id: 'release_new_feature', name: 'Fitur Baru',           icon: 'fa-rocket',        desc: 'Rilis dan update fitur terbaru', color: '#7c3aed' },
        { id: 'ide_saran_masukan',   name: 'Ide & Saran',          icon: 'fa-lightbulb',     desc: 'Masukan untuk pengembangan',    color: '#d97706' }
    ];

    // ==================== STATE ====================
    let currentUser = null;
    let currentTopicId = null;
    let topics = [];
    let messagesUnsubscribe = null;
    let topicsUnsubscribe = null;

    // ==================== INIT ====================
    async function init() {
        applyTheme();
        await initAuth();
        await ensureAgentTopics();
        await loadTopics();
    }

    function applyTheme() {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeIcon').className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('themeIcon').className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    });

    async function initAuth() {
        return new Promise((resolve) => {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    const snap = await db.collection('users').doc(user.uid).get();
                    let name = user.email.split('@')[0];
                    if (snap.exists) {
                        name = snap.data().name || name;
                    } else {
                        await db.collection('users').doc(user.uid).set({
                            name, email: user.email, role: 'user',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    document.getElementById('userName').textContent = name;
                    document.getElementById('userRole').textContent = 'Pengguna';
                    document.getElementById('logoutBtn').addEventListener('click', () => {
                        auth.signOut().then(() => window.location.href = 'index.html');
                    });
                    resolve();
                } else {
                    window.location.href = 'index.html';
                }
            });
        });
    }

    // ==================== PASTIKAN TOPIK ADA ====================
    async function ensureAgentTopics() {
        const ref = db.collection('chat_users').doc(currentUser.uid).collection('topics');
        for (const topic of DEFAULT_TOPICS) {
            const doc = await ref.doc(topic.id).get();
            if (!doc.exists) {
                await ref.doc(topic.id).set({
                    topicId: topic.id,
                    topicName: topic.name,
                    topicIcon: topic.icon,
                    topicDescription: topic.desc,
                    topicColor: topic.color,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessage: '',
                    lastMessageTime: null,
                    lastMessageSender: '',
                    lastMessageSenderId: '',
                    lastMessageSenderName: '',
                    unreadCount: {}
                });
            }
        }
    }

    // ==================== LOAD TOPIK ====================
    async function loadTopics() {
        if (topicsUnsubscribe) topicsUnsubscribe();
        const ref = db.collection('chat_users').doc(currentUser.uid).collection('topics');
        topicsUnsubscribe = ref.onSnapshot((snap) => {
            topics = [];
            snap.forEach(doc => {
                const d = doc.data();
                // FIX: unread untuk user = pesan dari staff yang belum dibaca
                // Simpan sebagai unreadStaff di field, bukan unreadCount[uid] sendiri
                const unread = d.unreadUser || 0;
                topics.push({
                    id: doc.id,
                    name: d.topicName,
                    icon: d.topicIcon,
                    desc: d.topicDescription,
                    color: d.topicColor,
                    lastMessage: d.lastMessage || '',
                    lastMessageTime: d.lastMessageTime,
                    lastMessageSender: d.lastMessageSender || '',
                    unread
                });
            });
            topics.sort((a, b) => {
                if (!a.lastMessageTime) return 1;
                if (!b.lastMessageTime) return -1;
                return b.lastMessageTime.toDate() - a.lastMessageTime.toDate();
            });
            renderTopics();
        });
    }

    function renderTopics() {
        const container = document.getElementById('topicsList');
        if (topics.length === 0) {
            container.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-3);font-size:13px;">Memuat topik...</div>';
            return;
        }
        container.innerHTML = topics.map(t => {
            const timeLabel = t.lastMessageTime ? formatTime(t.lastMessageTime) : '';
            const isFromStaff = t.lastMessageSender && t.lastMessageSender !== 'user';
            const preview = t.lastMessage
                ? `${isFromStaff ? '<b style="color:var(--primary-light)">Staff: </b>' : ''}${escapeHtml(t.lastMessage.substring(0, 35))}${t.lastMessage.length > 35 ? '…' : ''}`
                : '<span style="font-style:italic">Belum ada pesan</span>';
            return `
            <div class="topic-item ${currentTopicId === t.id ? 'active' : ''}" data-id="${t.id}">
                <div class="topic-icon-wrap" style="background:linear-gradient(135deg,${t.color},${t.color}bb)">
                    <i class="fas ${t.icon}"></i>
                </div>
                <div class="topic-meta">
                    <div class="topic-name">${escapeHtml(t.name)}</div>
                    <div class="topic-preview">${preview}</div>
                </div>
                <div class="topic-right">
                    ${timeLabel ? `<span class="topic-time">${timeLabel}</span>` : ''}
                    ${t.unread > 0 ? `<span class="unread-badge">${t.unread}</span>` : ''}
                </div>
            </div>`;
        }).join('');

        document.querySelectorAll('.topic-item').forEach(el => {
            el.addEventListener('click', () => selectTopic(el.dataset.id));
        });
    }

    // ==================== PILIH TOPIK ====================
    async function selectTopic(topicId) {
        currentTopicId = topicId;
        const topic = topics.find(t => t.id === topicId);
        if (!topic) return;

        document.querySelectorAll('.topic-item').forEach(el => el.classList.toggle('active', el.dataset.id === topicId));

        // Update header
        document.getElementById('chatTopicName').textContent = topic.name;
        document.getElementById('chatTopicDesc').textContent = topic.desc;
        const hi = document.getElementById('chatHeaderIcon');
        hi.style.background = `linear-gradient(135deg, ${topic.color}, ${topic.color}bb)`;
        hi.innerHTML = `<i class="fas ${topic.icon}"></i>`;

        // Show chat
        document.getElementById('chatEmpty').style.display = 'none';
        const ca = document.getElementById('chatActive');
        ca.style.display = 'flex';

        // Mark read: reset unreadUser
        try {
            await db.collection('chat_users').doc(currentUser.uid).collection('topics').doc(topicId)
                .update({ unreadUser: 0 });
        } catch(e) { console.warn('mark read:', e); }

        await loadMessages(topicId);
    }

    // ==================== LOAD PESAN ====================
    async function loadMessages(topicId) {
        if (messagesUnsubscribe) messagesUnsubscribe();
        const ref = db.collection('chat_users').doc(currentUser.uid)
            .collection('topics').doc(topicId).collection('messages');
        messagesUnsubscribe = ref.orderBy('timestamp', 'asc').onSnapshot(snap => {
            const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderMessages(msgs);
        });
    }

    function renderMessages(messages) {
        const container = document.getElementById('messagesContainer');
        if (messages.length === 0) {
            container.innerHTML = `
                <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);padding:40px;">
                    <i class="fas fa-comment-dots" style="font-size:36px;opacity:0.4"></i>
                    <p style="font-size:13px;">Belum ada pesan. Mulailah percakapan!</p>
                </div>`;
            return;
        }

        let lastDate = null;
        const html = messages.map(msg => {
            const isOutgoing = msg.sender === 'user';
            const cls = isOutgoing ? 'outgoing' : 'incoming';
            const avCls = isOutgoing ? 'user-av' : 'staff-av';
            const avInitial = isOutgoing ? '<i class="fas fa-user"></i>' : '<i class="fas fa-headset"></i>';

            let senderLabel = '';
            if (!isOutgoing) {
                const role = msg.sender === 'super_admin' ? 'Admin' : msg.sender === 'it' ? 'IT' : 'Staff';
                senderLabel = `${role}: ${escapeHtml(msg.senderName || 'Support')}`;
            } else {
                senderLabel = 'Anda';
            }

            let dateBlock = '';
            if (msg.timestamp) {
                const d = msg.timestamp.toDate();
                const dateStr = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
                if (dateStr !== lastDate) {
                    dateBlock = `<div class="date-divider">${dateStr}</div>`;
                    lastDate = dateStr;
                }
            }

            return `
                ${dateBlock}
                <div class="message ${cls}">
                    <div class="msg-avatar ${avCls}">${avInitial}</div>
                    <div class="msg-body">
                        <div class="msg-sender">${senderLabel}</div>
                        <div class="bubble">${escapeHtml(msg.text)}</div>
                        <div class="msg-time">${formatTimeFull(msg.timestamp)}</div>
                    </div>
                </div>`;
        }).join('');

        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    }

    // ==================== KIRIM PESAN ====================
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentTopicId || !currentUser) return;

        input.value = '';
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        try {
            const topicRef = db.collection('chat_users').doc(currentUser.uid)
                .collection('topics').doc(currentTopicId);
            const senderName = document.getElementById('userName').textContent;

            await topicRef.collection('messages').add({
                text,
                sender: 'user',
                senderId: currentUser.uid,
                senderName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                read: false
            });

            // Ambil semua staff & super_admin untuk update unread mereka
            const staffSnap = await db.collection('users').where('role', 'in', ['staff', 'super_admin']).get();
            const unreadUpdate = {};
            staffSnap.forEach(doc => {
                unreadUpdate[`unreadCount.${doc.id}`] = firebase.firestore.FieldValue.increment(1);
            });

            await topicRef.update({
                lastMessage: text,
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                lastMessageSender: 'user',
                lastMessageSenderId: currentUser.uid,
                lastMessageSenderName: senderName,
                ...unreadUpdate
            });
        } catch (err) {
            console.error('Error send:', err);
            alert('Gagal mengirim pesan: ' + err.message);
            input.value = text;
        } finally {
            btn.disabled = false;
            input.focus();
        }
    }

    // ==================== UTILS ====================
    function formatTime(ts) {
        if (!ts) return '';
        const d = ts.toDate();
        const now = new Date();
        const diff = now - d;
        const m = Math.floor(diff / 60000);
        const h = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);
        if (m < 1) return 'Baru saja';
        if (m < 60) return `${m}m`;
        if (h < 24) return `${h}j`;
        if (days < 7) return `${days}h`;
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    function formatTimeFull(ts) {
        if (!ts) return '';
        const d = ts.toDate();
        return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ==================== EVENT LISTENERS ====================
    document.addEventListener('DOMContentLoaded', init);
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
</script>
</body>
</html>
