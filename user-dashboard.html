<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Support Dashboard - Smart Chat System (Global Search)</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ══════════════════════════════════════════
           FONTS & TOKENS
        ══════════════════════════════════════════ */
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');

        :root {
            /* Brand */
            --pri:          #6366f1;
            --pri-dark:     #4f46e5;
            --pri-light:    #818cf8;
            --pri-glow:     rgba(99,102,241,.18);
            --pri-soft:     rgba(99,102,241,.09);

            /* Status */
            --success:      #10b981;
            --danger:       #f43f5e;
            --warning:      #f59e0b;

            /* Surface (light) */
            --bg:           #f1f5f9;
            --surface:      #ffffff;
            --surface-2:    #f8fafc;
            --surface-3:    #f1f5f9;
            --border:       #e2e8f0;
            --text:         #0f172a;
            --text-2:       #475569;
            --text-3:       #94a3b8;

            /* Chat bubbles (light) */
            --bubble-out:   #6366f1;
            --bubble-out-t: #ffffff;
            --bubble-in:    #ffffff;
            --bubble-in-t:  #0f172a;

            /* Misc */
            --sidebar-w:    310px;
            --header-h:     64px;
            --radius:       16px;
            --radius-sm:    10px;
            --radius-full:  9999px;
            --trans:        all .2s cubic-bezier(.4,0,.2,1);
            --shadow-xs:    0 1px 3px rgba(0,0,0,.04);
            --shadow-sm:    0 2px 8px rgba(0,0,0,.07);
            --shadow-md:    0 6px 20px rgba(0,0,0,.1);
            --shadow-lg:    0 16px 40px rgba(0,0,0,.14);
        }

        [data-theme="dark"] {
            --bg:           #0d1117;
            --surface:      #161b22;
            --surface-2:    #21262d;
            --surface-3:    #1a1f27;
            --border:       #30363d;
            --text:         #e6edf3;
            --text-2:       #8b949e;
            --text-3:       #484f58;
            --pri-soft:     rgba(99,102,241,.12);
            --pri-glow:     rgba(99,102,241,.22);
            --bubble-in:    #21262d;
            --bubble-in-t:  #e6edf3;
        }

        /* ══════════════════════════════════════════
           BASE
        ══════════════════════════════════════════ */
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--pri); }

        .app { display:flex; height:100vh; overflow:hidden; }

        /* ══════════════════════════════════════════
           SIDEBAR
        ══════════════════════════════════════════ */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: var(--trans);
        }

        /* Brand header */
        .sidebar-top {
            padding: 0 16px;
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--pri), var(--pri-light));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px var(--pri-glow);
        }

        .brand-icon i { color:#fff; font-size:16px; }

        .brand-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -.4px;
            background: linear-gradient(135deg, var(--pri), var(--pri-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn-icon {
            width: 34px; height: 34px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-2);
            font-size: 14px;
            transition: var(--trans);
            flex-shrink: 0;
        }

        .btn-icon:hover { background: var(--pri-soft); color: var(--pri); border-color: var(--pri-light); }

        /* Profile card */
        .profile-card {
            margin: 12px;
            padding: 14px;
            background: var(--pri-soft);
            border-radius: var(--radius);
            border: 1px solid var(--pri-glow);
            flex-shrink: 0;
        }

        .profile-row { display:flex; align-items:center; gap:12px; }

        .avatar {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--pri), var(--pri-light));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px var(--pri-glow);
            flex-shrink: 0;
        }

        .avatar i { color:#fff; font-size:18px; }

        .profile-info { flex:1; min-width:0; }

        .profile-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-role {
            font-size: 11px;
            color: var(--pri);
            font-weight: 600;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .online-dot {
            width: 7px; height: 7px;
            background: var(--success);
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 0 2px rgba(16,185,129,.2);
        }

        .logout-btn {
            background: rgba(244,63,94,.1);
            border: 1px solid rgba(244,63,94,.2);
            color: var(--danger);
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex; align-items: center; gap: 5px;
            transition: var(--trans);
            flex-shrink: 0;
        }

        .logout-btn:hover { background: var(--danger); color:#fff; border-color: var(--danger); }

        /* Topics list */
        .topics-header {
            padding: 12px 16px 6px;
            font-size: 10px;
            font-weight: 800;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .topics-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 8px;
        }

        .topic-item {
            display: flex;
            align-items: center;
            padding: 10px 10px;
            border-radius: 12px;
            cursor: pointer;
            gap: 10px;
            transition: var(--trans);
            margin-bottom: 2px;
            position: relative;
        }

        .topic-item:hover { background: var(--surface-3); }

        .topic-item.active {
            background: var(--pri-soft);
            box-shadow: inset 0 0 0 1px var(--pri-glow);
        }

        .topic-item.active .topic-name { color: var(--pri); font-weight: 700; }

        /* Active left indicator */
        .topic-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 20%; bottom: 20%;
            width: 3px;
            background: var(--pri);
            border-radius: 0 3px 3px 0;
        }

        .topic-icon-wrap {
            width: 42px; height: 42px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: var(--trans);
        }

        .topic-item:hover .topic-icon-wrap { transform: scale(1.06); }
        .topic-icon-wrap i { color:#fff; font-size:17px; }

        .topic-meta { flex:1; min-width:0; }

        .topic-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .topic-preview {
            font-size: 12px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
            flex-shrink: 0;
        }

        .topic-time { font-size: 10px; color: var(--text-3); }

        .unread-badge {
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            min-width: 18px; height: 18px;
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
            animation: badgePop .3s cubic-bezier(.34,1.56,.64,1);
        }

        @keyframes badgePop { from { transform: scale(0); } to { transform: scale(1); } }

        /* ══════════════════════════════════════════
           CHAT AREA
        ══════════════════════════════════════════ */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
            position: relative;
        }

        /* Chat BG pattern */
        .chat-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
            background-size: 26px 26px;
            opacity: .5;
            pointer-events: none;
        }

        [data-theme="dark"] .chat-area::before { opacity: .2; }

        /* Chat header */
        .chat-header {
            height: var(--header-h);
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
            position: relative;
            z-index: 5;
            box-shadow: var(--shadow-xs);
        }

        .chat-header-left { display:flex; align-items:center; gap:14px; flex-shrink:0; }

        .chat-header-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: var(--trans);
        }

        .chat-header-icon i { color:#fff; font-size:18px; }

        .chat-header-text h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -.2px;
        }

        .chat-header-text p {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 2px;
        }

        /* ── SEARCH ── */
        .search-container {
            position: relative;
            width: 280px;
            flex-shrink: 0;
        }

        .search-wrapper { position: relative; }

        .search-wrapper i.search-ico {
            position: absolute;
            left: 12px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 13px;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 9px 36px 9px 36px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-full);
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: var(--trans);
        }

        #searchInput:focus {
            border-color: var(--pri);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--pri-glow);
        }

        #searchInput::placeholder { color: var(--text-3); }

        .search-clear {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            cursor: pointer;
            font-size: 13px;
            display: none;
            transition: var(--trans);
        }

        .search-clear:hover { color: var(--danger); }

        /* Suggestions dropdown */
        .search-suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0; right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            max-height: 320px;
            overflow-y: auto;
            z-index: 200;
            display: none;
        }

        .search-suggestions.show { display: block; animation: dropIn .15s ease; }

        @keyframes dropIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

        .suggestion-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background .12s;
        }

        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: var(--pri-soft); }

        .suggestion-topic {
            font-size: 10px;
            font-weight: 700;
            color: var(--pri);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .suggestion-text { font-size: 13px; color: var(--text); word-break: break-word; }
        .suggestion-highlight { background: rgba(245,158,11,.35); border-radius: 2px; font-weight: 600; }
        .suggestion-empty { padding: 16px; text-align:center; color: var(--text-3); font-size: 13px; }

        /* ══════════════════════════════════════════
           MESSAGES
        ══════════════════════════════════════════ */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            z-index: 1;
        }

        /* Date divider */
        .date-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }

        .date-divider::before, .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .date-divider span {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-3);
            background: var(--surface-2);
            padding: 3px 12px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        /* Message row */
        .message {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: msgIn .2s ease;
        }

        @keyframes msgIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

        .message.outgoing { flex-direction: row-reverse; }

        /* Avatar */
        .msg-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700;
            flex-shrink: 0;
            margin-bottom: 2px;
            align-self: flex-end;
        }

        .user-av {
            background: linear-gradient(135deg, var(--pri), var(--pri-light));
            box-shadow: 0 2px 8px var(--pri-glow);
        }

        .staff-av {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 2px 8px rgba(16,185,129,.25);
        }

        .user-av i, .staff-av i { color: #fff; font-size: 12px; }

        /* Bubble wrapper */
        .msg-body { display:flex; flex-direction:column; max-width: 68%; }

        .message.outgoing .msg-body { align-items: flex-end; }
        .message.incoming .msg-body { align-items: flex-start; }

        .msg-sender {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-3);
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .message.outgoing .msg-sender { color: var(--pri-light); }

        /* Bubble */
        .bubble {
            padding: 10px 14px;
            line-height: 1.55;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }

        .message.outgoing .bubble {
            background: linear-gradient(135deg, var(--pri), var(--pri-dark));
            color: var(--bubble-out-t);
            border-radius: 18px 4px 18px 18px;
            box-shadow: 0 4px 16px var(--pri-glow);
        }

        .message.incoming .bubble {
            background: var(--bubble-in);
            color: var(--bubble-in-t);
            border-radius: 4px 18px 18px 18px;
            box-shadow: var(--shadow-xs);
            border: 1px solid var(--border);
        }

        /* Group same-sender consecutive bubbles */
        .message.outgoing + .message.outgoing { margin-top: -2px; }
        .message.outgoing + .message.outgoing .bubble { border-radius: 18px 18px 4px 18px; }
        .message.incoming + .message.incoming { margin-top: -2px; }
        .message.incoming + .message.incoming .bubble { border-radius: 18px 18px 18px 4px; }

        /* Timestamp */
        .msg-time {
            font-size: 10px;
            color: var(--text-3);
            margin-top: 3px;
            padding: 0 4px;
        }

        /* ══════════════════════════════════════════
           INPUT AREA
        ══════════════════════════════════════════ */
        .input-area {
            padding: 14px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            position: relative;
            z-index: 5;
            flex-shrink: 0;
        }

        .input-wrap {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 22px;
            padding: 6px 6px 6px 16px;
            transition: var(--trans);
        }

        .input-wrap:focus-within {
            border-color: var(--pri);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--pri-glow);
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            padding: 6px 0;
            resize: none;
            line-height: 1.5;
            min-height: 24px;
            max-height: 120px;
        }

        #messageInput::placeholder { color: var(--text-3); }

        .send-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pri), var(--pri-dark));
            border: none;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: var(--trans);
            box-shadow: 0 4px 12px var(--pri-glow);
        }

        .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px var(--pri-glow); }
        .send-btn:active { transform: scale(.94); }
        .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

        /* ══════════════════════════════════════════
           EMPTY / LOADING STATES
        ══════════════════════════════════════════ */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-3);
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        .empty-chat .ec-icon {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: var(--pri-soft);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            color: var(--pri);
            margin-bottom: 6px;
        }

        .empty-chat h3 { font-size: 17px; font-weight: 700; color: var(--text-2); }
        .empty-chat p  { font-size: 13px; max-width: 260px; }

        .spinner {
            width: 34px; height: 34px;
            border: 3px solid var(--border);
            border-top-color: var(--pri);
            border-radius: 50%;
            animation: spin .75s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ══════════════════════════════════════════
           MODAL — Settings
        ══════════════════════════════════════════ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 500;
            opacity: 0; visibility: hidden;
            transition: opacity .25s, visibility .25s;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-container {
            background: var(--surface);
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            margin: 16px;
            box-shadow: var(--shadow-lg);
            animation: modalIn .25s cubic-bezier(.34,1.56,.64,1);
            border: 1px solid var(--border);
        }

        @keyframes modalIn { from { opacity:0; transform:scale(.95) translateY(-10px); } to { opacity:1; transform:scale(1) translateY(0); } }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
        }

        .modal-header h3 i {
            width: 28px; height: 28px;
            background: var(--pri-soft);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: var(--pri);
            font-size: 13px;
        }

        .modal-close {
            background: none; border: none;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-3);
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items:center; justify-content:center;
            transition: var(--trans);
        }

        .modal-close:hover { background: var(--surface-3); color: var(--danger); }

        .modal-body { padding: 22px; }

        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-2);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: var(--trans);
        }

        .form-input:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-glow); }
        .form-input[disabled] { opacity: .6; cursor: not-allowed; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--pri), var(--pri-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: var(--trans);
            box-shadow: 0 4px 14px var(--pri-glow);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--pri-glow); }
        .btn-primary:active { transform: translateY(0); }

        /* ══════════════════════════════════════════
           TOAST
        ══════════════════════════════════════════ */
        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: var(--surface);
            padding: 12px 18px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            display: flex; align-items: center; gap: 10px;
            z-index: 1100;
            transform: translateY(80px) scale(.96);
            opacity: 0;
            transition: all .3s cubic-bezier(.34,1.56,.64,1);
            border-left: 3px solid var(--success);
            font-size: 14px;
            font-weight: 500;
        }

        .toast.show { transform: translateY(0) scale(1); opacity: 1; }

        /* ══════════════════════════════════════════
           MOBILE HAMBURGER
        ══════════════════════════════════════════ */
        .hamburger-btn {
            display: none;
            width: 34px; height: 34px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            cursor: pointer;
            align-items: center; justify-content: center;
            color: var(--text-2);
            font-size: 15px;
            flex-shrink: 0;
        }

        .mobile-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 15;
        }

        /* ══════════════════════════════════════════
           RESPONSIVE
        ══════════════════════════════════════════ */
        @media (max-width: 768px) {
            .hamburger-btn { display: flex; }
            .mobile-overlay.show { display: block; }

            .sidebar {
                position: fixed;
                left: calc(-1 * var(--sidebar-w));
                top: 0; bottom: 0;
                z-index: 20;
                box-shadow: var(--shadow-lg);
            }

            .sidebar.show {
                left: 0;
                animation: slideIn .25s ease;
            }

            @keyframes slideIn { from { left: calc(-1 * var(--sidebar-w)); } to { left: 0; } }

            .chat-header {
                height: auto;
                padding: 12px 14px;
                flex-wrap: wrap;
            }

            .search-container { width: 100%; order: 3; }

            .messages-container { padding: 14px 12px; }

            .msg-body { max-width: 80%; }

            .input-area { padding: 10px 12px; }
        }

        @media (max-width: 400px) {
            .msg-body { max-width: 88%; }
            .bubble { font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-headset"></i></div>
                <span class="brand-name">Support Chat</span>
            </div>
            <div style="display:flex;gap:6px">
                <button class="btn-icon" id="openSettingsBtn" title="Pengaturan"><i class="fas fa-cog"></i></button>
                <button class="btn-icon" id="themeBtn" title="Toggle tema"><i class="fas fa-moon" id="themeIcon"></i></button>
            </div>
        </div>
        <div class="profile-card"><div class="profile-row"><div class="avatar"><i class="fas fa-user"></i></div><div class="profile-info"><div class="profile-name" id="userName">Memuat...</div><div class="profile-role"><span class="online-dot"></span> <span id="userRole">Pengguna</span></div></div><button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button></div></div>
        <div class="topics-header">Kategori Bantuan</div>
        <div class="topics-list" id="topicsList"><div class="spinner"></div></div>
    </div>

    <!-- Mobile overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- Chat Area -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="hamburger-btn" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
                <div class="chat-header-icon" id="chatHeaderIcon" style="background:linear-gradient(135deg,#6366f1,#4f46e5)"><i class="fas fa-comment-dots"></i></div>
                <div class="chat-header-text">
                    <h3 id="chatTopicName">Support Chat</h3>
                    <p id="chatTopicDesc">Pilih kategori untuk memulai</p>
                </div>
            </div>
            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search search-ico"></i>
                    <input type="text" id="searchInput" placeholder="Cari di semua topik...">
                    <span class="search-clear" id="searchClear"><i class="fas fa-times-circle"></i></span>
                </div>
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer">
            <div class="empty-chat">
                <div class="ec-icon"><i class="fas fa-comment-dots"></i></div>
                <h3>Mulai Percakapan</h3>
                <p>Pilih topik di sebelah kiri untuk memulai diskusi dengan tim support</p>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrap">
                <input type="text" id="messageInput" placeholder="Tulis pesan..." autocomplete="off">
                <button class="send-btn" id="sendBtn" title="Kirim">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Pengaturan -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-container">
        <div class="modal-header">
            <h3><i class="fas fa-cog"></i> Pengaturan Akun</h3>
            <button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group"><label class="form-label">Email Akun</label><input type="email" id="settingsEmail" class="form-input" readonly disabled style="background:var(--surface-2)"></div>
            <div class="form-group"><label class="form-label">Password Saat Ini</label><input type="password" id="currentPass" class="form-input" placeholder="Masukkan password saat ini"></div>
            <div class="form-group"><label class="form-label">Password Baru</label><input type="password" id="newPass" class="form-input" placeholder="Minimal 6 karakter"></div>
            <div class="form-group"><label class="form-label">Konfirmasi Password Baru</label><input type="password" id="confirmPass" class="form-input" placeholder="Ulangi password baru"></div>
            <button id="changePasswordModalBtn" class="btn-primary"><i class="fas fa-key"></i> Ganti Password</button>
        </div>
    </div>
</div>
<div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDUZka4FZyLi_cv6X_5D4zeRsfkpqOlBpY",
        authDomain: "dashboard-css.firebaseapp.com",
        projectId: "dashboard-css",
        storageBucket: "dashboard-css.appspot.com",
        messagingSenderId: "771131792881",
        appId: "1:771131792881:web:ad634424225bd7de847850"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null, currentTopicId = null, topics = [], messagesUnsubscribe = null, topicsUnsubscribe = null;
    let allMessagesCache = []; // untuk search global (objek: {topicId, topicName, topicIcon, topicColor, text, sender, timestamp, ...})
    let currentSearchTerm = '';

    const DEFAULT_TOPICS = [
        { id: 'report_panel', name: 'Report Panel', icon: 'fa-file-alt', desc: 'Laporan dan panel monitoring', color: '#4f46e5' },
        { id: 'top_up_credit', name: 'Top Up Kredit', icon: 'fa-coins', desc: 'Top up kredit dan transaksi', color: '#10b981' },
        { id: 'general_discuss', name: 'General Discuss', icon: 'fa-users', desc: 'Diskusi umum layanan', color: '#f59e0b' },
        { id: 'information', name: 'Informasi', icon: 'fa-info-circle', desc: 'Pengumuman penting', color: '#ec4899' },
        { id: 'report_phising', name: 'Report Phising', icon: 'fa-shield-alt', desc: 'Laporan aktivitas mencurigakan', color: '#ef4444' },
        { id: 'release_new_feature', name: 'Fitur Baru', icon: 'fa-rocket', desc: 'Rilis update fitur', color: '#7c3aed' },
        { id: 'ide_saran_masukan', name: 'Ide & Saran', icon: 'fa-lightbulb', desc: 'Masukan untuk pengembangan', color: '#d97706' }
    ];

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
        toast.style.borderLeftColor = isError ? 'var(--danger)' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ========== GLOBAL SEARCH (semua topik) ==========
    // Fungsi untuk mengambil semua pesan dari semua topik (dilakukan sekali saat load, lalu diupdate realtime)
    async function loadAllMessagesForSearch() {
        if (!currentUser) return;
        const allTopics = topics; // ambil dari state
        allMessagesCache = [];
        for (const topic of allTopics) {
            const topicId = topic.id;
            const topicName = topic.topicName;
            const topicIcon = topic.topicIcon;
            const topicColor = topic.topicColor;
            const msgsRef = db.collection('chat_users').doc(currentUser.uid).collection('topics').doc(topicId).collection('messages');
            const snapshot = await msgsRef.orderBy('timestamp', 'asc').get();
            snapshot.forEach(doc => {
                const data = doc.data();
                allMessagesCache.push({
                    topicId: topicId,
                    topicName: topicName,
                    topicIcon: topicIcon,
                    topicColor: topicColor,
                    text: data.text || '',
                    sender: data.sender,
                    senderName: data.senderName,
                    timestamp: data.timestamp,
                    messageId: doc.id
                });
            });
        }
        // Urutkan berdasarkan timestamp (optional)
        allMessagesCache.sort((a, b) => (a.timestamp?.toDate() || 0) - (b.timestamp?.toDate() || 0));
    }

    // Fungsi untuk mencari di cache global
    function getGlobalSuggestions(query) {
        if (!query.trim()) return [];
        const lowerQuery = query.toLowerCase();
        const unique = new Map();
        for (const item of allMessagesCache) {
            const text = item.text || '';
            if (text.toLowerCase().includes(lowerQuery) && !unique.has(text + item.topicId)) {
                unique.set(text + item.topicId, item);
                if (unique.size >= 10) break;
            }
        }
        return Array.from(unique.values());
    }

    function highlightSuggestion(text, query) {
        if (!query) return escapeHtml(text);
        const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
        return escapeHtml(text).replace(regex, `<mark class="suggestion-highlight">$1</mark>`);
    }

    function renderGlobalSuggestions(suggestions, query) {
        const container = document.getElementById('searchSuggestions');
        if (!suggestions.length || !query.trim()) {
            container.classList.remove('show');
            container.innerHTML = '';
            return;
        }
        container.innerHTML = suggestions.map(sug => `
            <div class="suggestion-item" data-topic-id="${sug.topicId}" data-message-text="${escapeHtml(sug.text)}" data-message-timestamp="${sug.timestamp?.toDate?.() || ''}">
                <div class="suggestion-topic">
                    <i class="fas ${sug.topicIcon}" style="color:${sug.topicColor}"></i>
                    <span>${escapeHtml(sug.topicName)}</span>
                </div>
                <div class="suggestion-text">
                    ${highlightSuggestion(sug.text, query)}
                </div>
            </div>
        `).join('');
        container.classList.add('show');
        
        // Pasang event listener untuk setiap item
        document.querySelectorAll('.suggestion-item').forEach(el => {
            el.removeEventListener('click', globalSuggestionClickHandler);
            el.addEventListener('click', globalSuggestionClickHandler);
        });
    }

    async function globalSuggestionClickHandler(e) {
        const target = e.currentTarget;
        const topicId = target.getAttribute('data-topic-id');
        const messageText = target.getAttribute('data-message-text');
        if (!topicId) return;
        
        // Pilih topik tersebut
        await selectTopic(topicId);
        
        // Setelah topik terbuka, cari pesan yang cocok dan scroll ke sana
        setTimeout(() => {
            // Cari elemen bubble yang mengandung teks persis (atau highlight)
            const messagesContainer = document.getElementById('messagesContainer');
            const bubbles = messagesContainer.querySelectorAll('.bubble');
            for (let bubble of bubbles) {
                if (bubble.innerText.includes(messageText)) {
                    bubble.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    // Tambahkan efek highlight sementara
                    bubble.style.transition = 'background 0.3s';
                    bubble.style.backgroundColor = 'rgba(245, 158, 11, 0.3)';
                    setTimeout(() => {
                        bubble.style.backgroundColor = '';
                    }, 2000);
                    break;
                }
            }
        }, 500);
        
        // Sembunyikan dropdown
        hideSuggestions();
        // Kosongkan input search agar tidak mengganggu tampilan
        document.getElementById('searchInput').value = '';
        currentSearchTerm = '';
        applySearchHighlight(); // akan menghilangkan highlight
    }

    function hideSuggestions() {
        const container = document.getElementById('searchSuggestions');
        container.classList.remove('show');
        container.innerHTML = '';
    }

    let globalSearchDebounce;
    async function onGlobalSearchInput(e) {
        const query = e.target.value.trim();
        currentSearchTerm = query;
        const clearBtn = document.getElementById('searchClear');
        clearBtn.style.display = query ? 'block' : 'none';
        
        if (query) {
            clearTimeout(globalSearchDebounce);
            globalSearchDebounce = setTimeout(async () => {
                // Pastikan cache sudah terisi (jika belum, load dulu)
                if (allMessagesCache.length === 0 && topics.length > 0) {
                    await loadAllMessagesForSearch();
                }
                const suggestions = getGlobalSuggestions(query);
                renderGlobalSuggestions(suggestions, query);
            }, 200);
        } else {
            hideSuggestions();
        }
        // Jangan lakukan highlight di chat karena search global tidak otomatis memfilter chat
        // Tapi kita biarkan saja chat tetap menampilkan pesan topik yang aktif
    }

    // ========== AUTH & INIT ==========
    async function init() {
        applyTheme();
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                const snap = await db.collection('users').doc(user.uid).get();
                let name = user.email ? user.email.split('@')[0] : 'User';
                if (snap.exists && snap.data().name) name = snap.data().name;
                else await db.collection('users').doc(user.uid).set({ name, email: user.email || '', role: 'user', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('userName').innerText = name;
                document.getElementById('settingsEmail').value = user.email || 'Email tidak tersedia';
                await ensureTopics();
                await loadTopics();
            } else {
                window.location.href = 'index.html';
            }
        });
        document.getElementById('logoutBtn').onclick = () => auth.signOut().then(() => window.location.href = 'index.html');
        document.getElementById('themeBtn').onclick = toggleTheme;
        document.getElementById('openSettingsBtn').onclick = () => document.getElementById('settingsModal').classList.add('active');
        document.getElementById('closeModalBtn').onclick = () => document.getElementById('settingsModal').classList.remove('active');
        document.getElementById('changePasswordModalBtn').onclick = changePassword;
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('messageInput').addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
        
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('searchClear');
        searchInput.addEventListener('input', onGlobalSearchInput);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentSearchTerm = '';
            clearBtn.style.display = 'none';
            hideSuggestions();
            applySearchHighlight();
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) hideSuggestions();
        });
    }

    async function ensureTopics() {
        const ref = db.collection('chat_users').doc(currentUser.uid).collection('topics');
        for (const t of DEFAULT_TOPICS) {
            const doc = await ref.doc(t.id).get();
            if (!doc.exists) {
                await ref.doc(t.id).set({ topicId: t.id, topicName: t.name, topicIcon: t.icon, topicDescription: t.desc, topicColor: t.color, createdAt: firebase.firestore.FieldValue.serverTimestamp(), lastMessage: '', lastMessageTime: null, lastMessageSender: '', unreadUser: 0 });
            }
        }
    }

    async function loadTopics() {
        if (topicsUnsubscribe) topicsUnsubscribe();
        const ref = db.collection('chat_users').doc(currentUser.uid).collection('topics');
        topicsUnsubscribe = ref.onSnapshot(async (snap) => {
            topics = snap.docs.map(d => ({ id: d.id, ...d.data(), unread: d.data().unreadUser || 0 }));
            topics.sort((a,b) => (b.lastMessageTime?.toDate()||0) - (a.lastMessageTime?.toDate()||0));
            renderTopics();
            // Refresh cache global search
            await loadAllMessagesForSearch();
        });
    }

    function renderTopics() {
        const container = document.getElementById('topicsList');
        if (!topics.length) { container.innerHTML = '<div class="spinner"></div>'; return; }
        container.innerHTML = topics.map(t => {
            const preview = t.lastMessage ? (t.lastMessage.substring(0, 35) + (t.lastMessage.length>35?'…':'')) : 'Belum ada pesan';
            return `<div class="topic-item ${currentTopicId === t.id ? 'active' : ''}" data-id="${t.id}">
                <div class="topic-icon-wrap" style="background:linear-gradient(135deg,${t.topicColor},${t.topicColor}cc)"><i class="fas ${t.topicIcon}"></i></div>
                <div class="topic-meta"><div class="topic-name">${escapeHtml(t.topicName)}</div><div class="topic-preview">${escapeHtml(preview)}</div></div>
                <div class="topic-right">${t.lastMessageTime ? `<span class="topic-time">${formatTime(t.lastMessageTime)}</span>` : ''}${t.unread > 0 ? `<span class="unread-badge">${t.unread}</span>` : ''}</div>
            </div>`;
        }).join('');
        document.querySelectorAll('.topic-item').forEach(el => el.addEventListener('click', () => selectTopic(el.dataset.id)));
    }

    async function selectTopic(topicId) {
        if (messagesUnsubscribe) messagesUnsubscribe();
        currentTopicId = topicId;
        const topic = topics.find(t => t.id === topicId);
        if (topic) {
            document.getElementById('chatTopicName').innerText = topic.topicName;
            document.getElementById('chatTopicDesc').innerText = topic.topicDescription;
            const iconDiv = document.getElementById('chatHeaderIcon');
            iconDiv.style.background = `linear-gradient(135deg, ${topic.topicColor}, ${topic.topicColor}cc)`;
            iconDiv.innerHTML = `<i class="fas ${topic.topicIcon}"></i>`;
        }
        // mark read
        await db.collection('chat_users').doc(currentUser.uid).collection('topics').doc(topicId).update({ unreadUser: 0 });
        // load messages untuk topik ini (tampilkan di chat)
        const ref = db.collection('chat_users').doc(currentUser.uid).collection('topics').doc(topicId).collection('messages');
        messagesUnsubscribe = ref.orderBy('timestamp', 'asc').onSnapshot(snap => {
            const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderMessages(msgs);
        });
    }

    function renderMessages(messages) {
        const container = document.getElementById('messagesContainer');
        if (!messages.length) {
            container.innerHTML = `<div style="flex:1;text-align:center;padding:40px;color:var(--text-3)"><i class="fas fa-comment-dots"></i><p>Belum ada pesan</p></div>`;
            return;
        }
        let lastDate = null;
        let html = '';
        messages.forEach(msg => {
            const isOutgoing = msg.sender === 'user';
            const senderLabel = isOutgoing ? 'Anda' : (msg.senderName || 'Support');
            let displayText = msg.text;
            // Tidak ada highlight dari search global di sini (karena search global terpisah)
            if (msg.timestamp) {
                const d = msg.timestamp.toDate();
                const dateStr = d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long' });
                if (dateStr !== lastDate) { html += `<div class="date-divider"><span>${dateStr}</span></div>`; lastDate = dateStr; }
            }
            html += `<div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                <div class="msg-avatar ${isOutgoing ? 'user-av' : 'staff-av'}">${isOutgoing ? '<i class="fas fa-user"></i>' : '<i class="fas fa-headset"></i>'}</div>
                <div class="msg-body">
                    <div class="msg-sender">${senderLabel}</div>
                    <div class="bubble">${escapeHtml(displayText)}</div>
                    <div class="msg-time">${msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) : ''}</div>
                </div>
            </div>`;
        });
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    }

    function applySearchHighlight() {
        // Tidak digunakan untuk global search, biarkan kosong
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentTopicId || !currentUser) return;
        input.value = '';
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        try {
            const topicRef = db.collection('chat_users').doc(currentUser.uid).collection('topics').doc(currentTopicId);
            const senderName = document.getElementById('userName').innerText;
            await topicRef.collection('messages').add({ text, sender: 'user', senderId: currentUser.uid, senderName, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            const staffSnap = await db.collection('users').where('role', 'in', ['staff', 'super_admin']).get();
            const unreadUpdate = {};
            staffSnap.forEach(doc => { unreadUpdate[`unreadCount.${doc.id}`] = firebase.firestore.FieldValue.increment(1); });
            await topicRef.update({ lastMessage: text, lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(), lastMessageSender: 'user', lastMessageSenderId: currentUser.uid, lastMessageSenderName: senderName, ...unreadUpdate });
            // Refresh global cache setelah kirim pesan
            await loadAllMessagesForSearch();
        } catch(err) { showToast('Gagal kirim: '+err.message, true); input.value = text; }
        finally { btn.disabled = false; input.focus(); }
    }

    async function changePassword() {
        const currentPass = document.getElementById('currentPass').value;
        const newPass = document.getElementById('newPass').value;
        const confirm = document.getElementById('confirmPass').value;
        if (!currentPass || !newPass || !confirm) { showToast('Semua field harus diisi', true); return; }
        if (newPass !== confirm) { showToast('Password baru tidak cocok', true); return; }
        if (newPass.length < 6) { showToast('Password minimal 6 karakter', true); return; }
        const user = auth.currentUser;
        if (!user || !user.email) { showToast('Login dengan email untuk ganti password', true); return; }
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPass);
        try {
            await user.reauthenticateWithCredential(credential);
            await user.updatePassword(newPass);
            showToast('Password berhasil diubah!');
            document.getElementById('settingsModal').classList.remove('active');
            document.getElementById('currentPass').value = '';
            document.getElementById('newPass').value = '';
            document.getElementById('confirmPass').value = '';
        } catch (err) {
            let msg = 'Gagal ganti password';
            if (err.code === 'auth/wrong-password') msg = 'Password saat ini salah';
            else if (err.code === 'auth/weak-password') msg = 'Password terlalu lemah';
            showToast(msg, true);
        }
    }

    function toggleTheme() {
        const curr = document.documentElement.getAttribute('data-theme');
        const next = curr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('themeIcon').className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    function applyTheme() {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeIcon').className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    function formatTime(ts) { if(!ts) return ''; const d=ts.toDate(); const now=new Date(); const diff=now-d; const m=Math.floor(diff/60000); if(m<1) return 'Baru saja'; if(m<60) return `${m}m`; if(diff<86400000) return `${Math.floor(diff/3600000)}j`; return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function escapeRegex(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    init();

    // ── HAMBURGER (mobile sidebar toggle) ──
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const sidebar = document.getElementById('sidebar');

    hamburgerBtn && hamburgerBtn.addEventListener('click', () => {
        sidebar.classList.toggle('show');
        mobileOverlay.classList.toggle('show');
    });

    mobileOverlay && mobileOverlay.addEventListener('click', () => {
        sidebar.classList.remove('show');
        mobileOverlay.classList.remove('show');
    });

    // Close sidebar on topic click (mobile)
    document.getElementById('topicsList').addEventListener('click', () => {
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('show');
            mobileOverlay.classList.remove('show');
        }
    });
</script>
</body>
</html>
